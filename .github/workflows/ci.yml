name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Run repository validation
        run: >-
          uv run --no-sync python scripts/validate_repository.py
          --temp-root "${{ runner.temp }}"
          --evidence-file "${{ runner.temp }}/HasbaraTops-validation.json"
      - name: Emit repository validation diagnostics
        if: failure()
        run: |
          evidence="${{ runner.temp }}/HasbaraTops-validation.json"
          if [[ -f "$evidence" ]]; then
            cat "$evidence"
          fi
